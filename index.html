
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My ICT Portfolio</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #edf2f8;
            color: #26384a;
            margin: 0;
        }

        .navbar {
            background-color: #345678;
            padding: 20px;
            text-align: center;
        }

        .navbar h2 {
            color: white;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .header {
            background-color: #527da5;
            color: white;
            text-align: center;
            padding: 35px;
            margin: 25px auto;
            max-width: 800px;
            border-radius: 12px;
        }

        .container {
            background-color: white;
            max-width: 600px;
            margin: 25px auto;
            padding: 30px;
            border-radius: 12px;
        }

        h2, h3 {
            color: #345678;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #b8c8d9;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 95%;
            background-color: #527da5;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #345678;
        }

        .result {
            background-color: #f3f7fb;
            padding: 18px;
            margin-top: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .footer {
            text-align: center;
            color: #60758a;
            padding: 20px;
        }

</head>

<body>

    <div class="navbar">
        <h2 style="color: white;">MY ICT PORTFOLIO</h2>

        <a href="index.html">Home</a>
        <a href="elements.html">Element Checker</a>
        <a href="members.html">Club Members</a>
        <a href="about.html">Meet the Creator</a>
    </div>

    <div class="header">
        <h1 style="color: white;">Welcome to My ICT Portfolio!</h1>
        <p>A collection of my activities and projects for the second quarter.</p>
    </div>

    <div class="container">
        <h2>ICT Club Checker</h2>
        <p>Candidate Verification System</p>

        <input type="text" id="first_name" placeholder="First Name">
        <input type="text" id="last_name" placeholder="Last Name">

        <button py-click="check_member">ENTER</button>

        <div id="result" class="result">
            Enter your name above.
        </div>
    </div>

    <div class="footer">
        ICT 10 | Second Quarter | 2026-2027
